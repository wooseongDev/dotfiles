min_version = "2026.11.5"

[settings]
auto_update = true
idiomatic_version_file_enable_tools = ["node", "npm", "pnpm", "yarn"]
idiomatic_version_file_disable_files = ["node:package.json"]

[tools]
node = "24.22.3"
pnpm = "11.10.0"

[dotfiles]
"~/.gitconfig" = { source = "~/workspace/wooseong/dotfiles/.gitconfig" }
"~/.gitignore" = { source = "~/workspace/wooseong/dotfiles/.gitignore" }
"~/.config/mise/config.toml" = { source = "~/workspace/wooseong/dotfiles/mise/config.toml" }
"~/.agents/skills" = { source = "~/workspace/wooseong/dotfiles/agents/skills" }
"~/.cursor/rules" = { source = "~/workspace/wooseong/dotfiles/cursor/rules" }
"~/.codex/AGENTS.md" = { source = "~/workspace/wooseong/dotfiles/codex/AGENTS.md" }
"~/.codex/config.toml/base" = { source = "~/workspace/wooseong/dotfiles/codex/config.base.toml", merge = true }
